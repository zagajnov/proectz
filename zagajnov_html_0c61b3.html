<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            background-image: radial-gradient(circle at top right, #1e1b4b 0%, #020617 40%),
                              radial-gradient(circle at bottom left, #064e3b 0%, #020617 40%);
            background-attachment: fixed;
        }

        /* Кастомный скроллбар для темной темы */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-bubble-enter {
            animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Конфетти канвас поверх всего */
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0; w: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>

        // --- STREAMING_CHUNK:Функции логики и дат ---
        let currentRealDate = new Date(); // Для динамических расчетов
        
        function initApp() {
            // Установка даты в шапке
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').textContent = currentRealDate.toLocaleDateString('ru-RU', options);

            renderHolidays(document.getElementById('countrySelect').value);

                        b.classList.add('text-slate-400', 'border-transparent');
                    });
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

                    const targetId = btn.getAttribute('data-tab');
                    btn.classList.remove('text-slate-400', 'border-transparent');
                    btn.classList.add('text-indigo-400', 'border-indigo-500', 'bg-slate-800/30');
                    document.getElementById(targetId + 'Tab').classList.remove('hidden');
                });
            });

            document.getElementById('countrySelect').addEventListener('change', (e) => {

            });
        }

        function calculateDaysLeft(dateString) {
            const currentYear = currentRealDate.getFullYear();
            const [month, day] = dateString.split('-');
            let holidayDate = new Date(currentYear, parseInt(month) - 1, parseInt(day));
            
            // Убираем часы для точного сравнения дней
            const today = new Date(currentYear, currentRealDate.getMonth(), currentRealDate.getDate());
            
            const diffTime = holidayDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                // Праздник уже прошел в этом году, смотрим на следующий
                holidayDate.setFullYear(currentYear + 1);
                const nextDiff = holidayDate - today;
                return { days: Math.ceil(nextDiff / (1000 * 60 * 60 * 24)), status: 'next_year', text: 'Прошел' };
            } else if (diffDays === 0) {
                return { days: 0, status: 'today', text: 'Сегодня!' };
            }
            return { days: diffDays, status: 'upcoming', text: `Через ${diffDays} дн.` };
        }

        function checkTodayHolidays() {
            let todayStr = String(currentRealDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentRealDate.getDate()).padStart(2, '0');
            let found = [];
            
            for (let country in cisHolidays) {
                cisHolidays[country].forEach(h => {
                    if (h.d === todayStr && !found.includes(h.n)) {
                        found.push(h.n);
                    }
                });
            }
            
            const display = document.getElementById('todayHolidayDisplay');
            if (found.length > 0) {
                display.innerHTML = `🎉 Сегодня: ${found[0]}`;
                display.classList.remove('bg-emerald-400/10', 'text-emerald-400', 'border-emerald-400/20');
                display.classList.add('bg-fuchsia-500/20', 'text-fuchsia-300', 'border-fuchsia-500/30', 'animate-pulse');
                fireConfetti();
            } else {
                display.innerHTML = `📅 Обычный день`;
            }
        }

        // --- STREAMING_CHUNK:Отрисовка и Поиск ---
        function renderHolidays(country, filterText = "") {
            const container = document.getElementById('holidaysListContainer');
            container.innerHTML = '';
            
            let list = cisHolidays[country] || [];
            
            // Если есть поиск, фильтруем по всем странам или по текущей
            if (filterText) {
                list = [];
                const q = filterText.toLowerCase();
                for (let c in cisHolidays) {
                    cisHolidays[c].forEach(h => {
                        if (h.n.toLowerCase().includes(q) || (h.desc && h.desc.toLowerCase().includes(q))) {
                            // Добавляем флаг страны для контекста
                            const countryName = document.querySelector(`#countrySelect option[value="${c}"]`).textContent.split(' ')[0];
                            list.push({...h, cFlag: countryName});
                        }
                    });
                }
                // Убираем дубликаты по имени, если ищем глобально
                list = list.filter((v,i,a)=>a.findIndex(t=>(t.n === v.n && t.d === v.d))===i);
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-10"><i class="fa-solid fa-magnifying-glass text-3xl mb-3 opacity-50"></i><br>Ничего не найдено</div>`;
                return;
            }

            // Обогащаем данными о днях и сортируем (ближайшие сверху)
            list = list.map(h => {
                const timing = calculateDaysLeft(h.d);
                return { ...h, timing };
            });
            
            // Сортировка: сначала 'today', потом 'upcoming' (по возрастанию дней), потом 'next_year'
            list.sort((a, b) => {
                if (a.timing.status === 'today') return -1;
                if (b.timing.status === 'today') return 1;
                return a.timing.days - b.timing.days;
            });

            list.forEach(h => {
                const [m, d] = h.d.split('-');
                const formattedDate = `${parseInt(d)}.${parseInt(m)}`; // e.g. 1.01
                
                let badgeClass = "bg-slate-700 text-slate-300";
                let glowClass = "";
                if (h.timing.status === 'today') {
                    badgeClass = "bg-fuchsia-500 text-white font-bold animate-pulse";
                    glowClass = "border-fuchsia-500/50 shadow-[0_0_15px_rgba(217,70,239,0.2)]";
                } else if (h.timing.status === 'upcoming' && h.timing.days <= 14) {
                    badgeClass = "bg-indigo-500 text-white font-semibold";
                    glowClass = "border-indigo-500/30";
                } else if (h.timing.status === 'next_year') {
                    badgeClass = "bg-slate-800 text-slate-500";
                    glowClass = "opacity-75";
                }

                const flagSpan = h.cFlag ? `<span class="text-xs mr-2 opacity-70">${h.cFlag}</span>` : '';

                const el = document.createElement('div');
                el.className = `bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4 flex items-center gap-4 transition-all hover:bg-slate-700/60 hover:scale-[1.01] ${glowClass}`;
                el.innerHTML = `
                    <div class="text-3xl bg-slate-900 w-14 h-14 rounded-xl flex items-center justify-center shadow-inner border border-slate-700/50 flex-shrink-0">
                        ${h.e}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-white font-semibold truncate text-base sm:text-lg">${flagSpan}${h.n}</h3>
                        <p class="text-slate-400 text-xs sm:text-sm truncate">${h.desc || 'Праздник'}</p>
                    </div>
                    <div class="text-right flex flex-col items-end flex-shrink-0">
                        <span class="text-xs sm:text-sm font-medium text-slate-300 bg-slate-900/80 px-2 py-1 rounded-md mb-1">${formattedDate}</span>
                        <span class="text-[10px] sm:text-xs px-2 py-0.5 rounded-full ${badgeClass}">${h.timing.text}</span>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function executeSearch() {
            const q = document.getElementById('holidaySearchInput').value.trim();
            if (q) {
                renderHolidays('', q);
                document.getElementById('countrySelect').value = ""; // Сброс селекта
            } else {
                renderHolidays('russia');
                document.getElementById('countrySelect').value = "russia";
            }
        }

        // --- STREAMING_CHUNK:Логика ИИ Помощника ---
        function askAI(topic) {
            document.getElementById('aiInput').value = topic;
            sendAIMessage();
        }

        function appendMessage(text, isBot) {
            const container = document.getElementById('aiMessages');
            const wrap = document.createElement('div');
            wrap.className = `flex chat-bubble-enter ${isBot ? 'justify-start' : 'justify-end'}`;
            
            let bubbleClass = isBot 
                ? 'bg-slate-800 border border-slate-700 text-slate-200 rounded-tl-sm' 
                : 'bg-indigo-600 text-white rounded-tr-sm shadow-md shadow-indigo-900/30';
            
            wrap.innerHTML = `<div class="px-5 py-3.5 rounded-3xl max-w-[85%] text-sm sm:text-base leading-relaxed ${bubbleClass}">${text}</div>`;
            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('aiMessages');
            const wrap = document.createElement('div');
            wrap.id = 'typingIndicator';
            wrap.className = 'flex justify-start chat-bubble-enter';
            wrap.innerHTML = `<div class="bg-slate-800 border border-slate-700 px-5 py-4 rounded-3xl rounded-tl-sm"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const q = input.value.trim();
            if (!q) return;

            appendMessage(escapeHtml(q), false);
            input.value = '';
            
            showTyping();

            // Эмуляция задержки ответа (1-2 сек)
            setTimeout(() => {
                hideTyping();
                const reply = generateAIReply(q);
                appendMessage(reply, true);
                
                // Если ИИ нашел интересный праздник, запускаем конфетти
                if (reply.includes("✨") || reply.includes("🎉") || q.toLowerCase() === 'любой') {
                    fireConfetti();
                }
            }, 1000 + Math.random() * 800);
        }

        function generateAIReply(query) {
            const q = query.toLowerCase();
            
            if (q.includes("любой") || q.includes("случайный") || q.includes("рандом")) {
                const r = aiDB[Math.floor(Math.random() * aiDB.length)];
                return `${r.e} <strong>${r.n}</strong> (${r.c}, ${r.d})<br><br>✨ <i>Факт:</i> ${r.f}`;
            }

            const found = aiDB.find(h => 
                h.n.toLowerCase().includes(q) || 
                h.c.toLowerCase().includes(q) ||
                (q.includes("обезьян") && h.n.includes("Обезьян")) ||
                (q.includes("сыр") && h.n.includes("сыр"))
            );

            if (found) {
                return `О, я знаю про это! 🎉<br><br>${found.e} <strong>${found.n}</strong> (${found.c}, ${found.d})<br><br>✨ ${found.f}`;
            }

            if (q.includes("навруз")) return "🌱 <strong>Навруз</strong> – праздник прихода весны (21 марта). Люди готовят сумаляк из пророщенной пшеницы и прыгают через костер для очищения.";
            if (q.includes("холи")) return "🎨 <strong>Холи</strong> — знаменитый индийский фестиваль весной. На нем принято осыпать друг друга яркими красками. Символизирует победу добра над злом!";
            if (q.includes("снг")) return "Чтобы посмотреть праздники стран СНГ, переключитесь на первую вкладку вверху экрана! 👆";

            return `🤔 Хм, не уверен насчет «${escapeHtml(query)}». Но я постоянно учусь! Напишите <strong>«любой»</strong>, и я расскажу удивительный факт о празднике, который вы точно не знали.`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // --- STREAMING_CHUNK:Эффект Конфетти (Canvas) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            const colors = ['#6366f1', '#10b981', '#f43f5e', '#f59e0b', '#d946ef'];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: Math.random() * Math.PI
                });
            }
            if (!animationId) animateConfetti();
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            particles.forEach((p, index) => {
                p.dy += 0.5; // гравитация
                p.x += p.dx;
                p.y += p.dy;
                p.tiltAngle += 0.1;
                
                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if (p.y < canvas.height) active = true;
            });

            if (!active) {
                particles = [];
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        // Инициализация при загрузке
        window.onload = initApp;

    </script>
</body>
</html>
